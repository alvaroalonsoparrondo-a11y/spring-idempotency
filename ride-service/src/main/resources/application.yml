spring:
  application:
    name: ride-service
  datasource:
    url: ${RIDE_DB_URL:jdbc:postgresql://localhost:5432/rides}
    username: ${RIDE_DB_USERNAME:rides}
    password: ${RIDE_DB_PASSWORD:rides}
    hikari:
      # milliseconds; counted twice into the longest booking, which has to stay inside its idempotency lock
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration

idempify:
  schema:
    mode: FLYWAY

stripe:
  api-key: ${STRIPE_API_KEY}
  api-base: ${STRIPE_API_BASE:https://api.stripe.com}

server:
  # the origin ip of a request is the client's, as reported by the proxies Tomcat trusts
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # a regular expression of the proxy addresses whose X-Forwarded-For is believed; none unless the deployment
      # names them, so a caller cannot write the address of its choice into the audit trail
      internal-proxies: ${RIDE_TRUSTED_PROXIES:}
