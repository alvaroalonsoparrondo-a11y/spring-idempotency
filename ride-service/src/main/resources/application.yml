spring:
  application:
    name: ride-service
  datasource:
    url: ${RIDE_DB_URL:jdbc:postgresql://localhost:5432/rides}
    username: ${RIDE_DB_USERNAME:rides}
    password: ${RIDE_DB_PASSWORD:rides}
    hikari:
      # milliseconds; counted twice into the longest booking, which has to stay inside its idempotency lock
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${RIDE_REDIS_HOST:localhost}
      port: ${RIDE_REDIS_PORT:6379}
      password: ${RIDE_REDIS_PASSWORD:}
      timeout: 2s
  kafka:
    bootstrap-servers: ${RIDE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # the outbox marks a job sent only once every in-sync replica has it
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000

idempify:
  schema:
    mode: FLYWAY
  cache:
    # recorded responses are served from Redis first; a miss falls through to the operation's own row
    enabled: true
    type: DISTRIBUTED
    name: ride-service
  metrics:
    enabled: true
  response:
    # a repeat is answered under its own correlation id, the one its log lines carry, not the first request's
    excluded-headers:
      - X-Correlation-Id

oncebox:
  # stuck-event recovery, clean-up, three dead letter jobs and one poller for the receipt jobs
  thread-pool-size: 6
  outbox:
    sender:
      type: kafka
    dlq:
      enabled: true
    metrics:
      enabled: true
      gauge:
        # the gauges count rows in the database; cached, a scrape costs no query most of the time
        enabled: true
    events:
      ride-receipt:
        topic: ride-receipts
        polling:
          type: adaptive
          initial-delay: 10s
          min-fixed-delay: 250ms
          max-fixed-delay: 10s
          multiplier: 1.5

rides:
  receipts:
    topic:
      partitions: ${RIDE_RECEIPTS_TOPIC_PARTITIONS:3}
      replicas: ${RIDE_RECEIPTS_TOPIC_REPLICAS:1}

stripe:
  api-key: ${STRIPE_API_KEY}
  api-base: ${STRIPE_API_BASE:https://api.stripe.com}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    # one JSON object per line in Elastic Common Schema; the request's correlationId, idempotencyKey and userId ride
    # along from the MDC
    format:
      console: ecs

server:
  # the origin ip of a request is the client's, as reported by the proxies Tomcat trusts
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # a regular expression of the proxy addresses whose X-Forwarded-For is believed; none unless the deployment
      # names them, so a caller cannot write the address of its choice into the audit trail
      internal-proxies: ${RIDE_TRUSTED_PROXIES:}
