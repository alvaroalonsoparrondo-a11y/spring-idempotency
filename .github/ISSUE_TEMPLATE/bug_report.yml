name: Bug report
description: Report incorrect behaviour in one of the services or the infrastructure setup.
title: "Idempotency Key Pattern - [Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. docker compose up -d
        2. java -jar ride-service/target/ride-service-0.1.0-SNAPSHOT-exec.jar --spring.profiles.active=local
        3. POST /api/v1/rides with Idempotency-Key ... and body ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - ride-service
        - receipt-service
        - ride-simulator
        - load-tests
        - rides-contract
        - docker-compose / infrastructure
        - documentation
        - other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Branch, tag, or commit SHA if known.
      placeholder: main @ abc1234

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Java, Maven, OS, Docker versions.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Relevant application logs or stack traces (redact secrets).
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: This is not a security vulnerability (use private reporting instead).
          required: true
