name: Chore
description: Maintenance - a dependency bump, a build or CI change, test parity, docs that lag behind.
title: "Idempotency Key Pattern - [Chore]: "
labels:
  - tech-debt
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first - what is missing or hard today - and then the change you propose.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What is missing or wrong today, and why it matters.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should change - files, behaviour, configuration.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches and why they were not chosen.

  - type: dropdown
    id: component
    attributes:
      label: Primary component
      options:
        - ride-service
        - receipt-service
        - ride-simulator
        - load-tests
        - rides-contract
        - infrastructure / observability
        - build / CI
        - documentation
        - other
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Willing to contribute
      options:
        - label: I am willing to submit a pull request for this change.
        - label: I discussed this idea in an issue or discussion first (or this issue is that discussion).
