name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ride-service, receipt-service]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # the version's CHANGELOG section, then how to run that version
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          cat >> notes.md <<NOTES

          ## Quick Start

          \`\`\`bash
          curl -L https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/spring-idempotency-compose.tar.gz | tar xz
          VERSION=${version} docker compose -f compose.yaml -f compose.images.yaml --profile apps up -d
          \`\`\`
          NOTES

      - name: Compose files
        run: tar czf spring-idempotency-compose.tar.gz compose.yaml compose.images.yaml docker

      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: spring-idempotency-compose.tar.gz
          generate_release_notes: true
