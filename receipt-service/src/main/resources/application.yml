spring:
  application:
    name: receipt-service
  datasource:
    url: ${RECEIPT_DB_URL:jdbc:postgresql://localhost:5432/receipts}
    username: ${RECEIPT_DB_USERNAME:receipts}
    password: ${RECEIPT_DB_PASSWORD:receipts}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${RECEIPT_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      # offsets are committed after the listener returns, never on a timer before a job is handled
      enable-auto-commit: false
    producer:
      # dead letters are published only once every in-sync replica has them
      acks: all
      properties:
        enable.idempotence: true

logging:
  structured:
    # one JSON object per line in Elastic Common Schema, the receipt's ride, rider and charge as fields of their own
    format:
      console: ecs

oncebox:
  # the inbox clean-up
  thread-pool-size: 1
  outbox:
    enabled: false
  inbox:
    enabled: true
    source:
      type: kafka
    mappings:
      ride-receipt: io.github.idempotency.contract.ReceiptJob

receipts:
  topic:
    # the same as ride-service's, which creates the topic too
    partitions: ${RECEIPT_TOPIC_PARTITIONS:3}
    replicas: ${RECEIPT_TOPIC_REPLICAS:1}
